name: RESTMORE native Windows HTTPS parity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winhttps:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows libcurl with Schannel TLS
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = 'C:\vcpkg' }
          Write-Host "vcpkg: $root"
          & "$root\vcpkg.exe" install 'curl[schannel]:x64-windows-static'
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg curl install failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure native C11 + full HTTPS + GUI
        shell: pwsh
        run: |
          cmake -S . -B build -DRESTMORE_NETWORK=ON -DRESTMORE_GUI=ON -DRESTMORE_TESTS=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build Windows GUI with HTTPS crawler
        run: cmake --build build --config Release --parallel 2
      - name: Run Windows native C tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package actual standalone programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/restmore-gui.exe dist/
          Copy-Item build/Release/restmore-cli.exe dist/
          Copy-Item examples/openapi-petstore.json dist/demo-openapi.json
          "RESTMORE Windows native C11 full HTTPS edition. TLS: libcurl Schannel. Network requires explicit execute and authorization. No external application runtime or interpreter." | Out-File dist/README.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: restmore-Windows-x64-full-HTTPS
          path: dist/
          if-no-files-found: error
          retention-days: 30
