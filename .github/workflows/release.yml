name: RESTMORE v0.1.0-alpha.5 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restmore-release-0.1.0-alpha.5
  cancel-in-progress: false

env:
  RESTMORE_TAG: v0.1.0-alpha.5

jobs:
  package:
    name: Build, test and package / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
            network: "ON"
          - os: macos-15
            label: macos-native
            network: "ON"
          - os: windows-2022
            label: windows-x64-https
            network: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI + curl dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev xvfb
      - name: Install native Windows Schannel libcurl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = 'C:\vcpkg' }
          & "$root\vcpkg.exe" install 'curl:x64-windows-static'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows libcurl installation failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure native Windows HTTPS + raylib
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-release -DRESTMORE_NETWORK=ON -DRESTMORE_GUI=ON -DRESTMORE_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Configure native Unix HTTPS + raylib
        if: runner.os != 'Windows'
        run: cmake -S . -B build-release -DRESTMORE_GUI=ON -DRESTMORE_NETWORK=ON -DRESTMORE_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-release --config Release --parallel 2
      - name: Run native regression suite
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Import and export OpenAPI fixture
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLI=build-release/Release/restmore-cli.exe
          else
            CLI=build-release/restmore-cli
          fi
          "$CLI" --version
          "$CLI" --import examples/openapi-petstore.json --out build-release/release-smoke
          test -s build-release/release-smoke/library.json
      - name: GUI startup smoke (X11 virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build-release/restmore-gui --smoke
      - name: Package programs, sample and license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build-release/Release/restmore-gui.exe build-release/Release/restmore-cli.exe dist/
          else
            cp build-release/restmore-gui build-release/restmore-cli dist/
          fi
          cp README.md LICENSE examples/openapi-petstore.json dist/
          cp -R docs dist/docs
          if [ -f restmore-native-preview.png ]; then cp restmore-native-preview.png dist/; fi
          cat > dist/RELEASE-NOTES.txt <<'EOF'
          RESTMORE v0.1.0-alpha.5 / Native technical preview

          Native application and CLI source: ISO C11. Optional raylib GUI.
          Linux and macOS binaries: libcurl HTTPS documentation discovery.
          Windows binary: libcurl HTTPS documentation discovery with Schannel TLS.
          All desktop binaries support documented HTTPS discovery and local import.
          Android ARM64 offline NativeActivity debug APK is a separate release asset.
          Desktop ZIP includes original SVG plates, product description,
          field-guide HTML and the offline website demonstration.
          No iOS IPA is currently shipped.

          Experimental preview, not security-certified or production hardened.
          Obtain permission before crawling any external documentation target.
          For local preview/import, no network execution is required.
          EOF
          cmake -E tar cf "restmore-${RESTMORE_TAG}-${{ matrix.label }}.zip" --format=zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ matrix.label }}
          path: restmore-${{ env.RESTMORE_TAG }}-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 60

  android:
    name: Build and sign ARM64 NativeActivity debug APK
    uses: ./.github/workflows/android-gui.yml
    permissions:
      contents: read

  publish:
    name: Create GitHub prerelease with checksums
    needs: [package, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true
      - name: Download verified Android C11 NativeActivity APK
        uses: actions/download-artifact@v4
        with:
          name: restmore-android-arm64-nativeactivity-debug
          path: android-preview
      - name: Stage Android debug APK beside desktop archives
        shell: bash
        run: |
          set -euo pipefail
          cp android-preview/restmore-android-arm64-debug.apk             release-assets/restmore-v0.1.0-alpha.5-android-arm64-debug.apk
      - name: Verify packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test -s restmore-v0.1.0-alpha.5-android-arm64-debug.apk
          sha256sum *.zip *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RESTMORE_TAG" >/dev/null 2>&1; then
            echo "Existing release $RESTMORE_TAG retained unchanged."
            exit 0
          fi
          cat > notes.md <<'EOF'
          ## RESTMORE / v0.1.0-alpha.5

          Updated C11 **native technical preview** with architectural drafting details,
          art-directed GUI, complete illustrated field guide and interactive demo,
          Android density-aware scaling and touch-aware panel navigation,
          OpenAPI JSON import, local atlas exports and auditable C regression tests, including strict JSON number validation.

          - Linux x86_64 and macOS: libcurl HTTPS documentation crawler is compiled in.
          - Windows x64: native GUI and CLI now include the validated
            libcurl/Schannel HTTPS documentation crawler.
          - GitHub Pages now presents the native-console plate, product story,
            five-step guide and interactive **synthetic** route inspector.
          - Android arm64: experimental **offline native C11 APK** using Android
            NativeActivity; CI verified compilation, packaging and debug signing.
            Physical-device runtime and soft-keyboard integration are not yet verified.
          - iOS: portable C11 core build exists, but **no installable IPA** yet.
          - Each desktop archive includes executables, an OpenAPI sample,
            the repository license, the illustrated field guide,
            original vector architectural plates, and full website source.
          - Verify your archive against `SHA256SUMS.txt`.

          Android debug builds use an ephemeral CI signing key; uninstall older
          debug builds before installing a newer one. No production signing is claimed.

          The release is **prerelease/experimental**, not security-certified.
          Network discovery requires explicit authorization; use only on permitted sources.

          Build details: https://github.com/bspippi1337/restmore/actions
          EOF
          gh release create "$RESTMORE_TAG" \
            --target "$GITHUB_SHA" \
            --title "RESTMORE 0.1.0 alpha 5 | Architectural Edition" \
            --notes-file notes.md \
            --prerelease \
            release-assets/*.zip release-assets/*.apk release-assets/SHA256SUMS.txt
