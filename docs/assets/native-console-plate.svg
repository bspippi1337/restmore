<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 780" role="img" aria-labelledby="title desc"><title id="title">RESTMORE / native atlas console</title><desc id="desc">Illustrative three-panel RESTMORE desktop GUI with acquisition desk, four demo petstore operations mapped on an orbital atlas, and an inspector displaying a declared GET route. Schematic, not a live scan or actual screenshot.</desc>
<defs>
  <linearGradient id="panel"><stop stop-color="#11283a"/><stop offset="1" stop-color="#0a1725"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79f9dc"/><stop offset="1" stop-color="#5ebee2"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#255f61" stop-opacity=".42"/><stop offset="1" stop-color="#07101b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#406476" stroke-width=".5" opacity=".26" fill="none"/></pattern>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V9" stroke="#79f9dc" stroke-width=".8" opacity=".26"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
